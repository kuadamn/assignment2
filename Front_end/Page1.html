
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640, height=1136, initial-scale=1.0">
  <title>MULAH Loyalty Check</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      width: 640px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 50px;
      color: #4A4A4A;
    }
    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 38px;
      color: #F26D21;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 50px;
      text-align: left;
      width: 80%;
      margin-bottom: 10px;
      margin-left: 120px;
    }
    p {
      font-family: 'Montserrat', sans-serif;
      color: #F26D21;
      font-size: 20px;
      margin-bottom: 40px;
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    select, input[type="tel"] {
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    select {
      width: 140px;
    }
    input[type="tel"] {
      width: 200px;
    }
    .button {
      background-color: #F26D21;
      color: white;
      width: 280px;
      height: 58px;
      font-size: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    footer {
      margin-top: auto;
      text-align: center;
    }
    footer p {
      padding-bottom: 50px;
      font-size: 20px;
    }
    a {
      color: #0056b3;
      text-decoration: none;
    }
  </style>
</head>
<body id="page1">
  <div class="logo">MULAH</div>
  <h1>Hello,<br>Welcome!</h1>
  <p>Check Your Loyalty Points & Rewards</p>
  <div class="form-row">
    <select id="countryCode">
      <option value="+60">+60 (MY)</option>
      <option value="+65">+65 (SG)</option>
      <option value="+1">+1 (US)</option>
      <option value="+44">+44 (UK)</option>
      <option value="+91">+91 (IN)</option>
    </select>
    <input type="tel" id="phone" placeholder="Enter your mobile number">
  </div>
  <button class="button" onclick="checkPhone()">Check Loyalty Points</button>
  <footer>
    <p>Powered by <a href="https://MulahRewards.com">MulahRewards.com</a></p>
  </footer>
  <script>
    function checkPhone() {
      const code = document.getElementById("countryCode").value;
      const input = document.getElementById("phone").value.trim();
      const fullNumber = code + input;
      if (fullNumber === "+60173527250") {
        const params = new URLSearchParams({ phone: fullNumber });
        window.location.href = "page2.html?" + params.toString();
      } else {
        alert("Access Denied. Valid number required.");
      }
    }
  </script>
</body>
</html>
